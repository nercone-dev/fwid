name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Write the version of the tag into the sources
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          sed -i "/^\[project\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" pyproject.toml ports/lython/pyproject.toml
          sed -i "/^\[package\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" ports/rust/Cargo.toml
          (cd ports/js && npm pkg set version="$version")
          uv lock
          (cd ports/rust && cargo update --workspace)
      - name: Commit the version and move the tag onto it
        id: commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $GITHUB_REF_NAME"
            git push origin HEAD:main
            git tag -f "$GITHUB_REF_NAME"
            git push --force origin "refs/tags/$GITHUB_REF_NAME"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fwid/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: (cd dist && sha256sum *) > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
